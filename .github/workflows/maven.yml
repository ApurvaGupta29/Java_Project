name: Java CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # ---------- CI: build and test ----------
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and test
        run: |
          if [ -f pom.xml ]; then
            echo "Maven project found"
            mvn -B clean test
          else
            echo "Plain Java project found"
            mkdir -p out
            find src -name "*.java" > sources.txt
            javac -d out @sources.txt
          fi

  # ---------- CD: package and publish ----------
  cd:
    needs: ci
    if:
