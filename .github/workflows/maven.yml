name: Java CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # ---------- CI: build and test ----------
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Build and test
        run: |
          if [ -f pom.xml ]; then
            echo "Maven project found"
            mvn -B clean test
          else
            echo "Plain Java project found"
            mkdir -p out
            find src -name "*.java" > sources.txt
            javac -d out @sources.txt
          fi

  # ---------- CD: package and publish ----------
  cd:
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Package
        run: |
          if [ -f pom.xml ]; then
            mvn -B clean package -DskipTests
            cp target/*.jar app.jar
          else
            mkdir -p out
            find src -name "*.java" > sources.txt
            javac -d out @sources.txt
            jar cf app.jar -C out .
          fi

      - name: Upload jar
        uses: actions/upload-artifact@v5
        with:
          name: app-jar
          path: app.jar
